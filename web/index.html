<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meeting Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <!-- Root-relative paths: the page is served at /meeting/<id>/<hash> (see staticwebapp.config.json). -->
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="sprite" aria-hidden="true">
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M10.61 2.1L13.39 2.1L13.84 4.63L15.91 5.49L18.02 4.01L19.99 5.98L18.51 8.09L19.37 10.16L21.9 10.61L21.9 13.39L19.37 13.84L18.51 15.91L19.99 18.02L18.02 19.99L15.91 18.51L13.84 19.37L13.39 21.9L10.61 21.9L10.16 19.37L8.09 18.51L5.98 19.99L4.01 18.02L5.49 15.91L4.63 13.84L2.1 13.39L2.1 10.61L4.63 10.16L5.49 8.09L4.01 5.98L5.98 4.01L8.09 5.49L10.16 4.63Z"/><circle cx="12" cy="12" r="3.2"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M8 3v4M16 3v4M3.5 10h17"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3 10.5 13.5M21 3l-6.5 18-4-7.5L3 9.5 21 3Z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6.5 9.5 5.5 5.5 5.5-5.5"/></symbol>
    <symbol id="i-sort" viewBox="0 0 24 24"><path d="m8 9.5 4-4 4 4M8 14.5l4 4 4-4"/></symbol>
    <symbol id="i-sort-asc" viewBox="0 0 24 24"><path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"/></symbol>
    <symbol id="i-sort-desc" viewBox="0 0 24 24"><path d="M12 5v14M6.5 13.5 12 19l5.5-5.5"/></symbol>
  </svg>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 10v4M8.5 7v10M12 4.5v15M15.5 7v10M19 10v4"/></svg>
        </span>
        Meeting Assistant
      </div>
      <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb" hidden>
        <span class="crumb-root">Meetings</span>
        <span aria-hidden="true">/</span>
        <span id="crumb-current"></span>
      </nav>
      <div class="topbar-actions">
        <div class="menu-wrap">
          <button class="icon-btn" type="button" id="settings-button" aria-label="Settings" aria-haspopup="menu" aria-expanded="false" aria-controls="settings-menu"><svg class="icon"><use href="#i-gear"/></svg></button>
          <div class="menu menu-attached" id="settings-menu" role="menu" hidden>
            <button class="menu-item" type="button" role="menuitem" id="connect-github">Connect GitHub</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <p class="notice" id="notice" role="status">Loading meeting…</p>

  <main class="page" id="page" hidden>
    <div class="page-head">
      <div>
        <h1 id="meeting-title"></h1>
        <div class="meta">
          <span class="meta-item" id="when-item"><svg class="icon"><use href="#i-calendar"/></svg><span id="meeting-when"></span></span>
          <span class="meta-item" id="duration-item"><svg class="icon"><use href="#i-clock"/></svg><span id="meeting-duration"></span></span>
          <span class="meta-item" id="speakers-item"><span class="avatar-stack" id="speaker-avatars"></span><span id="speaker-count"></span></span>
        </div>
      </div>
      <div class="page-actions">
        <button class="btn btn-outline" type="button" id="export-button"><svg class="icon"><use href="#i-download"/></svg>Export</button>
      </div>
    </div>

    <div class="layout">
      <div class="main-col">
        <section class="card" aria-labelledby="summary-heading">
          <h2 id="summary-heading">Summary</h2>
          <div class="summary-text" id="summary-overview"></div>
          <div id="key-points">
            <h3 class="eyebrow">Key points</h3>
            <ul class="key-points" id="key-points-list"></ul>
          </div>
        </section>

        <section class="card" aria-labelledby="actions-heading">
          <div class="card-head">
            <div>
              <h2 id="actions-heading">Action items</h2>
              <p class="card-sub" id="actions-sub"></p>
            </div>
          </div>
          <div id="actions-body">
            <div class="progress">
              <div class="progress-row"><span>Progress</span><span id="progress-label"></span></div>
              <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
            </div>
            <div class="filters" id="filters" role="group" aria-label="Filter action items"></div>
            <!-- Search, owner and due date narrow the list; they combine with the status filters above. -->
            <div class="item-tools">
              <label class="search item-search">
                <svg class="icon"><use href="#i-search"/></svg>
                <input type="search" id="item-search" placeholder="Search tasks" aria-label="Search action items">
              </label>
              <select class="tool-select" id="owner-filter" aria-label="Filter by owner">
                <option value="">All owners</option>
              </select>
              <!-- Due date: a button that opens a month calendar (filled in by app.js). -->
              <div class="due-picker">
                <button type="button" class="tool-select due-button" id="due-button" aria-haspopup="dialog" aria-expanded="false" aria-controls="due-calendar">
                  <svg class="icon"><use href="#i-calendar"/></svg>
                  <span id="due-button-label">Any due date</span>
                  <svg class="icon due-chevron"><use href="#i-chevron"/></svg>
                </button>
                <div class="due-calendar" id="due-calendar" role="dialog" aria-label="Filter by due date" hidden></div>
              </div>
            </div>
            <div class="match-row" id="match-row" hidden>
              <span id="match-count" role="status"></span>
              <button type="button" class="clear-filters" id="clear-filters">Clear filters</button>
            </div>
            <!-- On narrow screens the table header is hidden, so sorting moves here. -->
            <label class="sort-mobile">Sort
              <select id="sort-select">
                <option value="">Default order</option>
                <option value="owner:asc">Owner A–Z</option>
                <option value="owner:desc">Owner Z–A</option>
                <option value="due:asc">Due: soonest first</option>
                <option value="due:desc">Due: latest first</option>
              </select>
            </label>
            <div class="table-wrap">
              <table class="items">
                <colgroup><col class="c-task"><col class="c-owner"><col class="c-due"><col class="c-status"><col class="c-follow-up"></colgroup>
                <thead><tr>
                  <th>Task</th>
                  <th aria-sort="none"><button class="sort-btn" type="button" data-sort="owner">Owner<svg class="icon"><use href="#i-sort"/></svg></button></th>
                  <th aria-sort="none"><button class="sort-btn" type="button" data-sort="due">Due<svg class="icon"><use href="#i-sort"/></svg></button></th>
                  <th>Status</th>
                  <th>Follow-up</th>
                </tr></thead>
                <tbody id="items-body"></tbody>
              </table>
            </div>
          </div>
        </section>
      </div>

      <aside class="card transcript" aria-labelledby="transcript-heading">
        <div class="transcript-head">
          <div class="card-head">
            <h2 id="transcript-heading">Transcript</h2>
            <div class="menu-wrap">
              <button class="icon-btn icon-btn-sm" type="button" id="download-button" aria-label="Download transcript" aria-haspopup="menu" aria-expanded="false" aria-controls="download-menu"><svg class="icon"><use href="#i-download"/></svg></button>
              <div class="menu" id="download-menu" role="menu" hidden>
                <button class="menu-item" type="button" role="menuitem" id="download-text">Download as text file</button>
                <button class="menu-item" type="button" role="menuitem" id="download-pdf">Download as PDF</button>
              </div>
            </div>
          </div>
          <label class="search">
            <svg class="icon"><use href="#i-search"/></svg>
            <input type="search" id="transcript-search" placeholder="Search transcript" aria-label="Search transcript">
          </label>
        </div>
        <ol class="transcript-list" id="transcript-list"></ol>
      </aside>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
