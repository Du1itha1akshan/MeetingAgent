<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meeting Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <!-- Root-relative paths: the page is served at /meeting/<id>/<hash> (see staticwebapp.config.json). -->
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="sprite" aria-hidden="true">
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M10.61 2.1L13.39 2.1L13.84 4.63L15.91 5.49L18.02 4.01L19.99 5.98L18.51 8.09L19.37 10.16L21.9 10.61L21.9 13.39L19.37 13.84L18.51 15.91L19.99 18.02L18.02 19.99L15.91 18.51L13.84 19.37L13.39 21.9L10.61 21.9L10.16 19.37L8.09 18.51L5.98 19.99L4.01 18.02L5.49 15.91L4.63 13.84L2.1 13.39L2.1 10.61L4.63 10.16L5.49 8.09L4.01 5.98L5.98 4.01L8.09 5.49L10.16 4.63Z"/><circle cx="12" cy="12" r="3.2"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M8 3v4M16 3v4M3.5 10h17"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 14v4.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V14"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3 10.5 13.5M21 3l-6.5 18-4-7.5L3 9.5 21 3Z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6.5 9.5 5.5 5.5 5.5-5.5"/></symbol>
  </svg>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 10v4M8.5 7v10M12 4.5v15M15.5 7v10M19 10v4"/></svg>
        </span>
        Meeting Assistant
      </div>
      <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb" hidden>
        <span class="crumb-root">Meetings</span>
        <span aria-hidden="true">/</span>
        <span id="crumb-current"></span>
      </nav>
      <div class="topbar-actions">
        <button class="icon-btn" type="button" aria-label="Settings"><svg class="icon"><use href="#i-gear"/></svg></button>
      </div>
    </div>
  </header>

  <p class="notice" id="notice" role="status">Loading meeting…</p>

  <main class="page" id="page" hidden>
    <div class="page-head">
      <div>
        <h1 id="meeting-title"></h1>
        <div class="meta">
          <span class="meta-item" id="when-item"><svg class="icon"><use href="#i-calendar"/></svg><span id="meeting-when"></span></span>
          <span class="meta-item" id="duration-item"><svg class="icon"><use href="#i-clock"/></svg><span id="meeting-duration"></span></span>
          <span class="meta-item" id="speakers-item"><span class="avatar-stack" id="speaker-avatars"></span><span id="speaker-count"></span></span>
        </div>
      </div>
      <div class="page-actions">
        <button class="btn btn-outline" type="button"><svg class="icon"><use href="#i-download"/></svg>Export</button>
        <button class="btn btn-dark" type="button"><svg class="icon"><use href="#i-share"/></svg>Share</button>
      </div>
    </div>

    <div class="layout">
      <div class="main-col">
        <section class="card" aria-labelledby="summary-heading">
          <div class="card-head">
            <h2 id="summary-heading">Summary</h2>
            <span class="badge">Generated from transcript</span>
          </div>
          <div class="summary-text" id="summary-overview"></div>
          <div id="key-points">
            <h3 class="eyebrow">Key points</h3>
            <ul class="key-points" id="key-points-list"></ul>
          </div>
        </section>

        <section class="card" aria-labelledby="actions-heading">
          <div class="card-head">
            <div>
              <h2 id="actions-heading">Action items</h2>
              <p class="card-sub" id="actions-sub"></p>
            </div>
            <div class="card-actions">
              <button class="btn btn-outline btn-sm" type="button"><svg class="icon"><use href="#i-plus"/></svg>Add item</button>
              <button class="btn btn-primary btn-sm" type="button"><svg class="icon"><use href="#i-send"/></svg>Send follow-up</button>
            </div>
          </div>
          <div id="actions-body">
            <div class="progress">
              <div class="progress-row"><span>Progress</span><span id="progress-label"></span></div>
              <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
            </div>
            <div class="filters" id="filters" role="group" aria-label="Filter action items"></div>
            <div class="table-wrap">
              <table class="items">
                <colgroup><col class="c-task"><col class="c-owner"><col class="c-due"><col class="c-status"><col class="c-tracker"></colgroup>
                <thead><tr><th>Task</th><th>Owner</th><th>Due</th><th>Status</th><th>Tracker</th></tr></thead>
                <tbody id="items-body"></tbody>
              </table>
            </div>
          </div>
        </section>
      </div>

      <aside class="card transcript" aria-labelledby="transcript-heading">
        <div class="transcript-head">
          <div class="card-head">
            <h2 id="transcript-heading">Transcript</h2>
            <button class="icon-btn icon-btn-sm" type="button" id="transcript-download" aria-label="Download transcript"><svg class="icon"><use href="#i-download"/></svg></button>
          </div>
          <label class="search">
            <svg class="icon"><use href="#i-search"/></svg>
            <input type="search" id="transcript-search" placeholder="Search transcript" aria-label="Search transcript">
          </label>
        </div>
        <ol class="transcript-list" id="transcript-list"></ol>
      </aside>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
